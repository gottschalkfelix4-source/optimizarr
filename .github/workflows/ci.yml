name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend-Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx

      - name: ffmpeg bereitstellen
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Tests
        run: pytest backend/tests -q

  frontend:
    name: Frontend-Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - name: Tests
        run: npm test
        working-directory: frontend

      - name: Typen pruefen
        run: npx tsc --noEmit
        working-directory: frontend

      - run: npm run build
        working-directory: frontend

  image:
    name: Docker-Image
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: An ghcr.io anmelden
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadaten
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Image fuer Pruefung bauen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-Test des Images
        run: |
          docker run -d --name smoke -p 8080:8080 \
            -e PUID=0 -e PGID=0 \
            ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}
          trap 'docker rm -f smoke > /dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/api/health > /dev/null; then
              echo "Container antwortet."
              # Captured first: `| grep -q` would end the pipe early, and with
              # pipefail the SIGPIPE on ffmpeg fails the step even on success.
              encoders="$(docker exec smoke ffmpeg -hide_banner -encoders 2>/dev/null || true)"
              missing=""
              for enc in libsvtav1 av1_qsv av1_vaapi libopus; do
                grep -qw "${enc}" <<< "${encoders}" || missing="${missing} ${enc}"
              done
              if [ -n "${missing}" ]; then
                echo "Im Image fehlen Encoder:${missing}"
                exit 1
              fi
              docker cp scripts/smoke-encode.py smoke:/tmp/smoke-encode.py
              docker exec smoke python3 /tmp/smoke-encode.py
              echo "Image-Start und echter AV1-/Opus-Encode erfolgreich."
              exit 0
            fi
            sleep 3
          done
          echo "Container ist nicht hochgekommen:"
          docker logs smoke
          exit 1

      # Push the exact local image that passed the checks, without rebuilding.
      - name: Geprueftes Image veroeffentlichen
        if: github.event_name != 'pull_request'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r image_tag; do
            [ -z "$image_tag" ] || docker push "$image_tag"
          done <<< "$IMAGE_TAGS"
